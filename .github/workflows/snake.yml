name: Generate contribution snake

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230077B6&color_dots=%23EBEDF0,%2390E0EF,%2348CAE4,%2300B4D8,%230077B6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300B4D8&color_dots=%23161B22,%230B3B60,%230077B6,%2300B4D8,%2390E0EF

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
